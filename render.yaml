services:
  - type: web
    name: gram-pulse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gram-pulse-db
          property: connectionString
databases:
  - name: gram-pulse-db
    plan: free
